steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/solar-eye-repo/backend:$COMMIT_SHA', '-f', 'docker/Dockerfile', '.']

  # 2. Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/solar-eye-repo/backend:$COMMIT_SHA']

  # 3. Apply Database Migrations (Optional - using a transient container)
  #  - name: 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/solar-eye-repo/backend:$COMMIT_SHA'
  #    entrypoint: 'alembic'
  #    args: ['upgrade', 'head']
  #    env:
  #      - 'DATABASE_URL=$_DATABASE_URL'
  #      # Note: Cloud Build needs Cloud SQL Proxy or similar to access Cloud SQL usually

  # 4. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'solar-eye-backend'
      - '--image'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/solar-eye-repo/backend:$COMMIT_SHA'
      - '--region'
      - 'asia-northeast3'
      - '--platform'
      - 'managed'
      - '--port'
      - '8000'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'APP_ENV=production,DEBUG=false'
      # Secrets and DB connections should be set in the Cloud Run service revision or via triggers

images:
  - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/solar-eye-repo/backend:$COMMIT_SHA'
